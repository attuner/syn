<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Synchro Radio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff3366;
      --accent-glow: rgba(255, 51, 102, 0.4);
      --cyan: #00d2ff;
      --green: #00e676;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --header-h: 65px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(circle at 50% 10%, #1a2236 0%, #090d16 80%);
      overflow-x: hidden;
    }
    .app-shell { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      width: 100%;
      height: var(--header-h);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 13, 22, 0.9);
      overflow: hidden;
      gap: 8px;
    }
    .logo-group { display: flex; align-items: center; gap: 8px; overflow: hidden; flex-shrink: 1; }
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logo i { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-live { background: rgba(0, 230, 118, 0.15); border: 1px solid rgba(0, 230, 118, 0.4); color: var(--green); }
    .badge-listeners { background: rgba(0, 210, 255, 0.15); border: 1px solid rgba(0, 210, 255, 0.4); color: var(--cyan); }
    .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; flex-shrink: 0; }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0.3; transform: scale(0.9); } }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-header {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .btn-header:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.2); }

    main {
      flex: 1;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .content-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tuner-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: clamp(20px, 4vw, 36px) 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .vinyl-wrapper {
      position: relative;
      width: clamp(170px, 28vw, 240px);
      height: clamp(170px, 28vw, 240px);
      margin: 10px auto 20px;
      flex-shrink: 0;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(#111, #222, #111, #333, #111);
      border: 6px solid #222;
      box-shadow: 0 0 30px rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }
    .vinyl.spinning { animation-play-state: running; }
    .vinyl-center {
      width: clamp(60px, 10vw, 80px);
      height: clamp(60px, 10vw, 80px);
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .track-info-pane { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .track-title { font-size: clamp(1.2rem, 2.5vw, 1.55rem); font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    .track-contributor { font-size: 0.88rem; color: var(--cyan); margin-bottom: 8px; font-weight: 500; }
    .slot-indicator { font-size: 0.78rem; color: #ffc107; margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .track-desc { font-size: 0.88rem; color: var(--subtext); line-height: 1.4; margin-bottom: 20px; min-height: 38px; max-width: 90%; }

    .switch-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; }
    .main-switch-btn {
      width: clamp(74px, 12vw, 90px);
      height: clamp(74px, 12vw, 90px);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff6b8b);
      border: none;
      color: #fff;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
      cursor: pointer;
      box-shadow: 0 8px 26px var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: none;
    }
    .main-switch-btn:active { transform: scale(0.92); }
    .main-switch-btn.playing { background: linear-gradient(135deg, #10b981, #00e676); box-shadow: 0 8px 26px rgba(0, 230, 118, 0.4); }

    .station-loading-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .station-loading-pill i { color: var(--accent); }

    @media (orientation: landscape) {
      body, .app-shell { height: 100vh; overflow: hidden; }
      main { height: calc(100vh - var(--header-h)); height: calc(100dvh - var(--header-h)); padding: 12px 20px; align-items: center; }
      .content-wrapper { max-width: 950px; height: 100%; justify-content: center; }
      .tuner-card {
        height: 100%;
        max-height: calc(100vh - var(--header-h) - 24px);
        max-height: calc(100dvh - var(--header-h) - 24px);
        flex-direction: row;
        justify-content: space-evenly;
        padding: 14px 30px;
        gap: 30px;
      }
      .vinyl-wrapper { width: min(44vh, 250px); height: min(44vh, 250px); margin: 0; }
      .track-info-pane { align-items: flex-start; text-align: left; max-width: 50%; }
      .track-title { max-width: 100%; }
      .track-desc { max-width: 100%; margin-bottom: 12px; }
      .switch-container { align-items: flex-start; min-height: auto; }
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: #161b22;
      border: 1px solid var(--card-border); border-radius: 24px; padding: 24px;
    }
    .form-group { margin-bottom: 14px; width: 100%; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--subtext); margin-bottom: 6px; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px; background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border); color: #fff; font-size: 0.9rem; outline: none;
    }
    .btn {
      width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 0.92rem;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; margin-top: 8px; }

    .file-dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 18px 14px;
      text-align: center; cursor: pointer; background: rgba(0, 0, 0, 0.2); display: flex;
      flex-direction: column; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="app-shell">
  <header>
    <div class="logo-group">
      <div class="logo">
        <i class="fa-solid fa-tower-broadcast"></i>
        <span id="stationNameDisplay">Synchro Radio</span>
      </div>
      <div class="badge badge-live"><span class="pulse-dot"></span><span>LIVE</span></div>
      <div class="badge badge-listeners"><i class="fa-solid fa-headphones"></i><span id="liveListenerCountDisplay">1</span></div>
    </div>
    <div class="header-actions">
      <button class="btn-header" onclick="openScheduleModal()"><i class="fa-solid fa-calendar-days" style="color:var(--cyan);"></i><span>Schedule</span></button>
      <button class="btn-header" onclick="openAccountModal()"><i class="fa-solid fa-user-circle"></i><span id="headerAccountLabel">Login</span></button>
    </div>
  </header>

  <main>
    <div class="content-wrapper">
      <div class="tuner-card">
        <div class="vinyl-wrapper"><div id="vinyl" class="vinyl"><div class="vinyl-center"><i class="fa-solid fa-radio"></i></div></div></div>
        <div class="track-info-pane">
          <div class="track-title" id="trackTitleDisplay">Connecting Live...</div>
          <div class="track-contributor" id="trackContributorDisplay">Live Audio Synchronization</div>
          <div class="slot-indicator" id="currentSlotDisplay">Synchronizing Stream...</div>
          <div class="track-desc" id="trackDescDisplay">Live radio streaming in exact push point sync.</div>
          <div class="switch-container">
            <div id="stationLoadingPill" class="station-loading-pill"><i class="fa-solid fa-spinner fa-spin"></i><span>Connecting to Push Points...</span></div>
            <button id="radioPowerBtn" class="main-switch-btn" onclick="toggleRadio()"><i class="fa-solid fa-power-off"></i></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal: Schedule -->
<div id="scheduleModal" class="modal-overlay" onclick="closeScheduleModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3><i class="fa-solid fa-calendar-days" style="color:var(--cyan); margin-right:8px;"></i>Daily Push Points Schedule</h3>
      <button onclick="closeScheduleModal()" style="background:none; border:none; color:var(--subtext); font-size:1.3rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="scheduleTimelineList">Loading schedule...</div>
  </div>
</div>

<!-- Modal: Account & Upload -->
<div id="accountModal" class="modal-overlay" onclick="closeAccountModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3><i class="fa-solid fa-user-astronaut" style="color:var(--accent); margin-right:8px;"></i>Contributor Portal</h3>
      <button onclick="closeAccountModal()" style="background:none; border:none; color:var(--subtext); font-size:1.3rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div id="authGuestBox">
      <div class="form-group"><label>Mobile Number</label><input type="tel" id="loginMobile" placeholder="e.g. 9876543210"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="Enter password"></div>
      <button class="btn btn-primary" onclick="submitLogin()">Sign In</button>
    </div>

    <div id="authMemberBox" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div><strong id="profUsername">User</strong><div style="font-size:0.8rem; color:var(--subtext);" id="profMobile"></div></div>
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px;" onclick="logout()">Logout</button>
      </div>

      <div id="uploadAllowedSection">
        <div class="form-group"><label>Audio Title</label><input type="text" id="audioTitle" placeholder="Track Title"></div>
        <div class="form-group"><label>Description</label><textarea id="audioDesc" rows="2" placeholder="Description"></textarea></div>
        <div class="form-group">
          <label>Audio File (.mp3, .m4a, .wav)</label>
          <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" onchange="handleFileSelected(this)">
          <div class="file-dropzone" onclick="document.getElementById('audioFileInput').click()">
            <i class="fa-solid fa-file-audio" style="font-size:1.8rem; color:var(--cyan);"></i>
            <div id="fileStatusText" style="font-size:0.85rem; font-weight:600;">Tap to Select Audio File</div>
          </div>
        </div>
        <button class="btn btn-primary" id="uploadBtn" onclick="uploadAudio()">Upload Audio Track</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ================= CONFIGURATION =================
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxIM9fWOdU4skEnXuxVe6DR6FS7z-a3AdEepC4o6AS5WQiLV_lWp0EmBXCg0rSv-Mj5Cg/exec";

  let listenerId = localStorage.getItem('cr_listener_id') || ('L_' + Math.random().toString(36).substring(2, 9));
  localStorage.setItem('cr_listener_id', listenerId);

  let allTracks = [];
  let hourlySchedules = {};
  let activePlaylist = [];
  let currentIndex = 0;
  let isPlaying = false;
  let currentUser = JSON.parse(localStorage.getItem('cr_user') || 'null');
  let selectedAudioFile = null;
  let selectedAudioDurationSec = 0;
  let serverTimeOffset = 0;

  const audioCache = {};
  let activePlayer = new Audio();
  let standbyPlayer = new Audio();
  let isStandbyReady = false;

  window.addEventListener('load', () => {
    if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
    fetchStationData();
    renderAuth();
    setInterval(checkLiveSynchronization, 5000);
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3200);
  }

  function openAccountModal() { document.getElementById('accountModal').classList.add('open'); }
  function closeAccountModal(e) { if (!e || e.target === document.getElementById('accountModal')) document.getElementById('accountModal').classList.remove('open'); }
  function openScheduleModal() { renderScheduleTimeline(); document.getElementById('scheduleModal').classList.add('open'); }
  function closeScheduleModal(e) { if (!e || e.target === document.getElementById('scheduleModal')) document.getElementById('scheduleModal').classList.remove('open'); }

  function formatTimeHMS(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function renderScheduleTimeline() {
    const box = document.getElementById('scheduleTimelineList');
    const nowHour = new Date(Date.now() + serverTimeOffset).getHours();
    let html = '';

    for (let h = 0; h <= 23; h++) {
      const slot = hourlySchedules[String(h)] || { name: "", trackIds: [] };
      const name = slot.name || `Hour ${h} Stream`;
      const isCurrent = (h === nowHour);
      html += `
        <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:10px 14px; border-radius:10px; margin-bottom:8px;">
          <div style="font-size:0.8rem; color:${isCurrent ? 'var(--green)' : 'var(--cyan)'}; font-weight:700;">Hour ${h}:00 ${isCurrent ? '• LIVE NOW' : ''}</div>
          <div style="font-size:0.92rem; font-weight:600; color:#fff;">${name} (${slot.trackIds.length} tracks scheduled)</div>
        </div>
      `;
    }
    box.innerHTML = html;
  }

  // Exact Synchronization to Dynamic Push Points
  function getSynchronizedCurrentTrackIndex(playlist) {
    if (!playlist || playlist.length === 0) return { index: 0, seekSec: 0 };

    const now = new Date(Date.now() + serverTimeOffset);
    const elapsedSecInHour = (now.getMinutes() * 60) + now.getSeconds();

    let cumulativeSec = 0;
    for (let i = 0; i < playlist.length; i++) {
      const duration = playlist[i].durationSec || 180;
      if (elapsedSecInHour >= cumulativeSec && elapsedSecInHour < (cumulativeSec + duration)) {
        return { index: i, seekSec: elapsedSecInHour - cumulativeSec };
      }
      cumulativeSec += duration;
    }

    // If total track durations < 3600, loop smoothly through the playlist
    const loopSec = elapsedSecInHour % (cumulativeSec || 1);
    let wrapCumulative = 0;
    for (let i = 0; i < playlist.length; i++) {
      const duration = playlist[i].durationSec || 180;
      if (loopSec >= wrapCumulative && loopSec < (wrapCumulative + duration)) {
        return { index: i, seekSec: loopSec - wrapCumulative };
      }
      wrapCumulative += duration;
    }

    return { index: 0, seekSec: 0 };
  }

  function resolveCurrentHourPlaylist() {
    const now = new Date(Date.now() + serverTimeOffset);
    const hour = now.getHours();
    const slot = hourlySchedules[String(hour)];

    if (slot && slot.trackIds && slot.trackIds.length > 0) {
      const scheduled = [];
      slot.trackIds.forEach(id => {
        const found = allTracks.find(t => t.fileId === id && t.approvalStatus === "approved");
        if (found) scheduled.push(found);
      });
      if (scheduled.length > 0) {
        document.getElementById('currentSlotDisplay').innerText = `Hour ${hour} • ${slot.name || 'Live Slot'}`;
        return scheduled;
      }
    }

    const approved = allTracks.filter(t => t.approvalStatus === "approved");
    document.getElementById('currentSlotDisplay').innerText = `Hour ${hour} • Live Rotation`;
    return approved.length > 0 ? approved : allTracks;
  }

  async function fetchStationData() {
    try {
      const res = await fetch(`${BACKEND_URL}?action=getStationData`);
      const data = await res.json();
      if (data.success) {
        if (data.serverTime) serverTimeOffset = data.serverTime - Date.now();
        allTracks = data.tracks || [];
        hourlySchedules = data.hourly || {};

        activePlaylist = resolveCurrentHourPlaylist();

        if (activePlaylist.length > 0) {
          document.getElementById('stationLoadingPill').style.display = 'none';
          document.getElementById('radioPowerBtn').style.display = 'block';

          const syncState = getSynchronizedCurrentTrackIndex(activePlaylist);
          currentIndex = syncState.index;
          playCurrentTrackImmediate(syncState.seekSec);
        }
      }
    } catch (e) {
      setTimeout(fetchStationData, 4000);
    }
  }

  async function checkLiveSynchronization() {
    const syncState = getSynchronizedCurrentTrackIndex(activePlaylist);
    // If the scheduled push point boundary advanced to next audio
    if (syncState.index !== currentIndex) {
      currentIndex = syncState.index;
      playCurrentTrackImmediate(syncState.seekSec);
    }
  }

  async function resolveTrackAudio(track) {
    if (!track) return null;
    if (audioCache[track.fileId]) return audioCache[track.fileId];
    try {
      const res = await fetch(`${BACKEND_URL}?action=streamAudio&fileId=${encodeURIComponent(track.fileId)}`);
      const data = await res.json();
      if (data.success && data.dataUri) {
        audioCache[track.fileId] = data.dataUri;
        return data.dataUri;
      }
    } catch(err) {}
    return track.streamUrl;
  }

  // Dual Player Engine for Instant Pre-buffered Boundary Pushes
  function setupPlayerEvents(player) {
    player.addEventListener('timeupdate', () => {
      if (player.duration && (player.duration - player.currentTime <= 4) && !isStandbyReady) {
        prepareStandbyTrack();
      }
    });
    player.addEventListener('ended', () => { advanceTrackInstantly(); });
  }
  setupPlayerEvents(activePlayer);
  setupPlayerEvents(standbyPlayer);

  async function prepareStandbyTrack() {
    if (activePlaylist.length === 0) return;
    const nextIdx = (currentIndex + 1) % activePlaylist.length;
    const nextTrack = activePlaylist[nextIdx];
    const src = await resolveTrackAudio(nextTrack);
    if (src) {
      standbyPlayer.src = src;
      standbyPlayer.load();
      standbyPlayer._trackRef = nextTrack;
      isStandbyReady = true;
    }
  }

  async function advanceTrackInstantly() {
    if (activePlaylist.length === 0) return;
    currentIndex = (currentIndex + 1) % activePlaylist.length;

    const temp = activePlayer;
    activePlayer = standbyPlayer;
    standbyPlayer = temp;
    isStandbyReady = false;

    const currentTrack = activePlayer._trackRef || activePlaylist[currentIndex];
    if (!activePlayer.src || activePlayer.src === "") {
      activePlayer.src = await resolveTrackAudio(currentTrack);
      activePlayer._trackRef = currentTrack;
    }

    activePlayer.play().catch(e => console.warn(e));
    updateTunerUI(currentTrack);
  }

  async function playCurrentTrackImmediate(seekSec = 0) {
    if (!activePlaylist || activePlaylist.length === 0) return;
    const track = activePlaylist[currentIndex];
    const audioSource = await resolveTrackAudio(track);

    activePlayer.src = audioSource;
    activePlayer._trackRef = track;
    updateTunerUI(track);

    const playPromise = activePlayer.play();
    isPlaying = true;

    if (playPromise !== undefined) {
      playPromise.then(() => {
        if (seekSec > 0 && activePlayer.duration && seekSec < activePlayer.duration) {
          activePlayer.currentTime = seekSec;
        }
        isStandbyReady = false;
        prepareStandbyTrack();
      }).catch(err => {
        isPlaying = false;
        updateTunerUI(track);
      });
    }
  }

  function toggleRadio() {
    if (activePlaylist.length === 0) return;
    if (isPlaying) {
      activePlayer.pause();
      isPlaying = false;
      updateTunerUI(activePlaylist[currentIndex]);
    } else {
      const syncState = getSynchronizedCurrentTrackIndex(activePlaylist);
      currentIndex = syncState.index;
      playCurrentTrackImmediate(syncState.seekSec);
    }
  }

  function updateTunerUI(track) {
    const btn = document.getElementById('radioPowerBtn');
    const vinyl = document.getElementById('vinyl');
    const title = document.getElementById('trackTitleDisplay');
    const contrib = document.getElementById('trackContributorDisplay');

    if (track) {
      title.innerText = track.title;
      contrib.innerText = "Curated by " + (track.contributor || "Synchro Voice");
    }
    if (isPlaying) {
      btn.classList.add('playing');
      vinyl.classList.add('spinning');
    } else {
      btn.classList.remove('playing');
      vinyl.classList.remove('spinning');
    }
  }

  // Dynamic Client-Side Runtime Measure on File Selection
  function handleFileSelected(input) {
    if (input.files && input.files.length > 0) {
      const file = input.files[0];
      selectedAudioFile = file;

      // Extract exact audio duration before uploading
      const tempAudio = new Audio();
      tempAudio.src = URL.createObjectURL(file);
      tempAudio.onloadedmetadata = () => {
        selectedAudioDurationSec = Math.round(tempAudio.duration) || 180;
        document.getElementById('fileStatusText').innerText = `${file.name} (${formatTimeHMS(selectedAudioDurationSec)})`;
      };

      const titleInput = document.getElementById('audioTitle');
      if (!titleInput.value.trim()) titleInput.value = file.name.replace(/\.[^/.]+$/, "");
    }
  }

  async function uploadAudio() {
    const title = document.getElementById('audioTitle').value.trim();
    const description = document.getElementById('audioDesc').value.trim();
    const btn = document.getElementById('uploadBtn');

    if (!title || !selectedAudioFile) return showToast("Enter title and choose file");

    btn.disabled = true;
    btn.innerText = "Encoding with exact runtime...";

    const reader = new FileReader();
    reader.onload = async function() {
      const base64Data = reader.result.split(',')[1];
      try {
        const payload = {
          action: "uploadAudio",
          mobile: currentUser.mobile,
          username: currentUser.username,
          title,
          description,
          durationSec: selectedAudioDurationSec,
          fileName: selectedAudioFile.name,
          mimeType: selectedAudioFile.type || "audio/mpeg",
          base64File: base64Data
        };

        const res = await fetch(BACKEND_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.success) {
          showToast("Uploaded with exact runtime! Awaiting admin approval.");
          closeAccountModal();
          fetchStationData();
        } else {
          showToast(result.message || "Upload failed");
        }
      } catch (err) {
        showToast("Error uploading track.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Upload Audio Track";
      }
    };
    reader.readAsDataURL(selectedAudioFile);
  }

  async function submitLogin() {
    const mobile = document.getElementById('loginMobile').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    try {
      const res = await fetch(BACKEND_URL, { method: 'POST', body: JSON.stringify({ action: "login", mobile, password }) });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        localStorage.setItem('cr_user', JSON.stringify(currentUser));
        renderAuth();
      } else showToast("Login failed");
    } catch(e) {}
  }

  function logout() { currentUser = null; localStorage.removeItem('cr_user'); renderAuth(); }

  function renderAuth() {
    if (!currentUser) {
      document.getElementById('authGuestBox').style.display = 'block';
      document.getElementById('authMemberBox').style.display = 'none';
      document.getElementById('headerAccountLabel').innerText = "Login";
    } else {
      document.getElementById('authGuestBox').style.display = 'none';
      document.getElementById('authMemberBox').style.display = 'block';
      document.getElementById('headerAccountLabel').innerText = currentUser.username;
      document.getElementById('profUsername').innerText = currentUser.username;
      document.getElementById('profMobile').innerText = currentUser.mobile;
    }
  }
</script>
