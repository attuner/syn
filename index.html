<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Synchro Radio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff3366;
      --accent-glow: rgba(255, 51, 102, 0.4);
      --cyan: #00d2ff;
      --green: #00e676;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --header-h: 65px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(circle at 50% 10%, #1a2236 0%, #090d16 80%);
      overflow-x: hidden;
    }
    .app-shell { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      width: 100%;
      height: var(--header-h);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 13, 22, 0.9);
      overflow: hidden;
      gap: 8px;
    }
    .logo-group { display: flex; align-items: center; gap: 8px; overflow: hidden; flex-shrink: 1; }
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logo i { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-live { background: rgba(0, 230, 118, 0.15); border: 1px solid rgba(0, 230, 118, 0.4); color: var(--green); }
    .badge-listeners { background: rgba(0, 210, 255, 0.15); border: 1px solid rgba(0, 210, 255, 0.4); color: var(--cyan); }
    .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; flex-shrink: 0; }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0.3; transform: scale(0.9); } }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-header {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    main {
      flex: 1;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .content-wrapper { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }
    .tuner-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: clamp(20px, 4vw, 36px) 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .vinyl-wrapper {
      position: relative;
      width: clamp(170px, 28vw, 240px);
      height: clamp(170px, 28vw, 240px);
      margin: 10px auto 20px;
      flex-shrink: 0;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(#111, #222, #111, #333, #111);
      border: 6px solid #222;
      box-shadow: 0 0 30px rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }
    .vinyl.spinning { animation-play-state: running; }
    .vinyl-center {
      width: clamp(60px, 10vw, 80px);
      height: clamp(60px, 10vw, 80px);
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .track-info-pane { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .track-title { font-size: clamp(1.2rem, 2.5vw, 1.55rem); font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    .track-contributor { font-size: 0.88rem; color: var(--cyan); margin-bottom: 8px; font-weight: 500; }
    .slot-indicator { font-size: 0.78rem; color: #ffc107; margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .track-desc { font-size: 0.88rem; color: var(--subtext); line-height: 1.4; margin-bottom: 20px; min-height: 38px; max-width: 90%; }

    .switch-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; }
    .main-switch-btn {
      width: clamp(74px, 12vw, 90px);
      height: clamp(74px, 12vw, 90px);
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff6b8b);
      border: none;
      color: #fff;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
      cursor: pointer;
      box-shadow: 0 8px 26px var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: none;
    }
    .main-switch-btn:active { transform: scale(0.92); }
    .main-switch-btn.playing { background: linear-gradient(135deg, #10b981, #00e676); box-shadow: 0 8px 26px rgba(0, 230, 118, 0.4); }

    .station-loading-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      font-size: 0.85rem;
      font-weight: 600;
    }

    @media (orientation: landscape) {
      body, .app-shell { height: 100vh; overflow: hidden; }
      main { height: calc(100dvh - var(--header-h)); padding: 12px 20px; align-items: center; }
      .content-wrapper { max-width: 950px; height: 100%; justify-content: center; }
      .tuner-card {
        height: 100%;
        max-height: calc(100dvh - var(--header-h) - 24px);
        flex-direction: row;
        justify-content: space-evenly;
        padding: 14px 30px;
        gap: 30px;
      }
      .vinyl-wrapper { width: min(44vh, 250px); height: min(44vh, 250px); margin: 0; }
      .track-info-pane { align-items: flex-start; text-align: left; max-width: 50%; }
      .switch-container { align-items: flex-start; min-height: auto; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; animation: modalFade 0.25s ease-out; }
    @keyframes modalFade { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .modal-close { background: none; border: none; color: var(--subtext); font-size: 1.3rem; cursor: pointer; }

    .sched-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sched-card.active-now { border-color: var(--accent); background: rgba(255, 51, 102, 0.08); }
    .sched-time { font-size: 0.8rem; color: var(--subtext); font-weight: 600; }
    .sched-title { font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 2px; }

    .form-group { margin-bottom: 14px; width: 100%; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--subtext); margin-bottom: 6px; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .btn { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; margin-top: 8px; }

    .file-dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .selected-file-card {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(0, 230, 118, 0.08);
      border: 1px solid rgba(0, 230, 118, 0.3);
      border-radius: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 0.82rem;
      z-index: 200;
      display: none;
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="app-shell">
  <header>
    <div class="logo-group">
      <div class="logo">
        <i class="fa-solid fa-tower-broadcast"></i>
        <span id="stationNameDisplay">Synchro Radio</span>
      </div>
      <div class="badge badge-live">
        <span class="pulse-dot"></span>
        <span>LIVE</span>
      </div>
      <div class="badge badge-listeners">
        <i class="fa-solid fa-headphones"></i>
        <span id="liveListenerCountDisplay">1</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-header" onclick="openScheduleModal()">
        <i class="fa-solid fa-calendar-days" style="color:var(--cyan);"></i>
        <span>Schedule</span>
      </button>

      <button class="btn-header" onclick="openAccountModal()">
        <i class="fa-solid fa-user-circle"></i>
        <span id="headerAccountLabel">Login</span>
      </button>
    </div>
  </header>

  <main>
    <div class="content-wrapper">
      <div class="tuner-card">
        <div class="vinyl-wrapper">
          <div id="vinyl" class="vinyl">
            <div class="vinyl-center"><i class="fa-solid fa-radio"></i></div>
          </div>
        </div>

        <div class="track-info-pane">
          <div class="track-title" id="trackTitleDisplay">Radio Ready</div>
          <div class="track-contributor" id="trackContributorDisplay">Click to Start Playing</div>
          <div class="slot-indicator" id="currentSlotDisplay">Synchronizing Timeline...</div>
          <div class="track-desc" id="trackDescDisplay">Live radio streaming.</div>

          <div class="switch-container">
            <div id="stationLoadingPill" class="station-loading-pill">
              <i class="fa-solid fa-spinner fa-spin"></i>
              <span>Connecting to Synchro Radio...</span>
            </div>

            <button id="radioPowerBtn" class="main-switch-btn" onclick="toggleRadio()">
              <i class="fa-solid fa-power-off"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Schedule Modal -->
<div id="scheduleModal" class="modal-overlay" onclick="closeScheduleModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3><i class="fa-solid fa-calendar-days" style="color:var(--cyan); margin-right:8px;"></i>Daily Radio Schedule</h3>
      <button class="modal-close" onclick="closeScheduleModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="scheduleTimelineList">Loading schedule...</div>
  </div>
</div>

<!-- Account & Upload Modal -->
<div id="accountModal" class="modal-overlay" onclick="closeAccountModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fa-solid fa-user-astronaut" style="color:var(--accent); margin-right:8px;"></i>Contributor Portal</h3>
      <button class="modal-close" onclick="closeAccountModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div id="authGuestBox">
      <div id="loginFormBox">
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="loginMobile" placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Enter password">
        </div>
        <button class="btn btn-primary" onclick="submitLogin()">Sign In</button>
        <button class="btn btn-secondary" onclick="toggleAuthMode('register')">Create New Account</button>
      </div>

      <div id="registerFormBox" style="display:none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="e.g. RJ Rajesh">
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="regMobile" placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Create password">
        </div>
        <button class="btn btn-primary" onclick="submitRegister()">Register Now</button>
        <button class="btn btn-secondary" onclick="toggleAuthMode('login')">Already have an account?</button>
      </div>
    </div>

    <div id="authMemberBox" style="display:none;">
      <div style="background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:18px; padding:16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:700; font-size:1.1rem;" id="profUsername">User</div>
          <div style="color:var(--subtext); font-size:0.8rem;" id="profMobile"></div>
        </div>
        <button class="btn btn-secondary" style="width:auto; padding:8px 14px; font-size:0.75rem;" onclick="logout()">Logout</button>
      </div>

      <div id="uploadGateBox">
        <div id="uploadAllowedSection" style="display:none; margin-bottom: 20px;">
          <h4 style="margin-bottom:8px;"><i class="fa-solid fa-cloud-arrow-up" style="color:var(--cyan); margin-right:6px;"></i>Upload Audio Track</h4>
          <div class="form-group">
            <label>Audio Title</label>
            <input type="text" id="audioTitle" placeholder="e.g. Morning Folk Tunes">
          </div>
          <div class="form-group">
            <label>Audio Description</label>
            <textarea id="audioDesc" rows="2" placeholder="Brief info about this audio..."></textarea>
          </div>
          <div class="form-group">
            <label>Audio File (.mp3, .m4a, .wav)</label>
            <input type="file" id="audioFileInput" accept=".mp3,audio/*" style="display:none;" onchange="handleFileSelected(this)">
            <div class="file-dropzone" id="fileDropZone" onclick="triggerFilePicker()">
              <i class="fa-solid fa-file-audio" style="font-size:1.8rem; color:var(--cyan);"></i>
              <div style="font-size:0.85rem; font-weight:600; color:#fff;">Tap to Select Audio</div>
            </div>
            <div class="selected-file-card" id="selectedFileCard">
              <div id="fileMetaName" style="font-size:0.85rem; font-weight:600;"></div>
            </div>
          </div>
          <button class="btn btn-primary" id="uploadBtn" onclick="uploadAudio()">Upload Audio Track</button>
        </div>

        <div id="uploadLockedSection" style="text-align:center; padding: 20px 14px; display:none;">
          <p style="font-size:0.8rem; color:var(--subtext);">Contributor privileges unlock upon admin approval.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxIM9fWOdU4skEnXuxVe6DR6FS7z-a3AdEepC4o6AS5WQiLV_lWp0EmBXCg0rSv-Mj5Cg/exec";

  let listenerId = localStorage.getItem('cr_listener_id') || ('L_' + Math.random().toString(36).substring(2, 9));
  localStorage.setItem('cr_listener_id', listenerId);

  let allTracks = [];
  let hourlySchedules = {};
  let sharedHourlyRandomSeq = [];
  let isPlaying = false;
  let currentUser = JSON.parse(localStorage.getItem('cr_user') || 'null');
  let selectedAudioFile = null;
  let detectedDuration = 0;
  let currentSeqVersion = null;
  let lastPushVersion = null;

  let activePlayer = new Audio();
  let scheduledTimeline = []; // [{ track, startOffset, endOffset }]
  let currentTrackItem = null;

  window.addEventListener('load', () => {
    fetchStationData();
    renderAuth();
    setInterval(sendHeartbeat, 20000);
    setInterval(maintainTimelineSync, 3000);
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3200);
  }

  function openAccountModal() { document.getElementById('accountModal').classList.add('open'); }
  function closeAccountModal(e) {
    if (!e || e.target === document.getElementById('accountModal')) {
      document.getElementById('accountModal').classList.remove('open');
    }
  }

  function openScheduleModal() {
    renderScheduleTimeline();
    document.getElementById('scheduleModal').classList.add('open');
  }
  function closeScheduleModal(e) {
    if (!e || e.target === document.getElementById('scheduleModal')) {
      document.getElementById('scheduleModal').classList.remove('open');
    }
  }

  function renderScheduleTimeline() {
    const box = document.getElementById('scheduleTimelineList');
    const nowHour = new Date().getHours();
    let html = '';

    for (let h = 5; h <= 23; h++) {
      const slot = hourlySchedules[String(h)];
      const name = (slot && slot.name && slot.name.trim() !== '') ? slot.name : 'Synchronized Timeline Rotation';
      const formattedTime = (h % 12 || 12) + (h >= 12 ? ':00 PM' : ':00 AM') + ' – ' + ((h + 1) % 12 || 12) + ((h + 1) >= 12 && (h + 1) < 24 ? ':00 PM' : ':00 AM');
      const isCurrent = (h === nowHour);

      html += `
        <div class="sched-card ${isCurrent ? 'active-now' : ''}">
          <div>
            <div class="sched-time">${formattedTime} ${isCurrent ? '• <span style="color:var(--green);">LIVE NOW</span>' : ''}</div>
            <div class="sched-title">${name}</div>
          </div>
          <i class="fa-solid fa-radio" style="color:${isCurrent ? 'var(--accent)' : 'var(--subtext)'}; font-size:1.1rem;"></i>
        </div>
      `;
    }
    box.innerHTML = html;
  }

  async function sendHeartbeat() {
    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: "heartbeat",
          listenerId,
          username: currentUser ? currentUser.username : "Guest Listener",
          isPlaying
        })
      });
      const data = await res.json();
      if (data.success && typeof data.activeCount === 'number') {
        const count = isPlaying ? Math.max(1, data.activeCount) : data.activeCount;
        document.getElementById('liveListenerCountDisplay').innerText = `${count}`;
      }
    } catch(err) {}
  }

  // ================= 3) TIMELINE SYNCHRONIZATION ENGINE =================
  // Builds exact push points for the current hour based on each track's real duration
  function buildCurrentHourTimeline() {
    const now = new Date();
    const currentHour = now.getHours();
    const slot = hourlySchedules[String(currentHour)];
    let trackList = [];

    if (slot && slot.trackIds && slot.trackIds.length > 0) {
      slot.trackIds.forEach(id => {
        const t = allTracks.find(item => item.fileId === id && item.approvalStatus === "approved");
        if (t) trackList.push(t);
      });
    }

    // Fallback: fill remaining timeline with approved random sequence tracks
    const randomTracks = (sharedHourlyRandomSeq.length > 0 ? sharedHourlyRandomSeq : [])
      .map(id => allTracks.find(t => t.fileId === id && t.approvalStatus === "approved"))
      .filter(Boolean);

    if (randomTracks.length === 0) {
      trackList = allTracks.filter(t => t.approvalStatus === "approved");
    }

    // Line up push points end-to-end to fill the 3600-second hour window
    const timeline = [];
    let currentOffset = 0;
    let fallbackIdx = 0;

    // Line up scheduled slot tracks first
    for (let trk of trackList) {
      const dur = trk.duration > 0 ? trk.duration : 180;
      timeline.push({ track: trk, startOffset: currentOffset, endOffset: currentOffset + dur });
      currentOffset += dur;
      if (currentOffset >= 3600) break;
    }

    // Continue filling until the 1-hour push point loop is covered
    while (currentOffset < 3600 && randomTracks.length > 0) {
      const trk = randomTracks[fallbackIdx % randomTracks.length];
      const dur = trk.duration > 0 ? trk.duration : 180;
      timeline.push({ track: trk, startOffset: currentOffset, endOffset: currentOffset + dur });
      currentOffset += dur;
      fallbackIdx++;
    }

    return timeline;
  }

  // Matches absolute wall-clock time so every listener hears identical audio at identical timestamps
  function getCurrentScheduledAudio() {
    if (scheduledTimeline.length === 0) return null;
    const now = new Date();
    const currentSecondOfHour = (now.getMinutes() * 60) + now.getSeconds() + (now.getMilliseconds() / 1000);

    for (let item of scheduledTimeline) {
      if (currentSecondOfHour >= item.startOffset && currentSecondOfHour < item.endOffset) {
        return {
          track: item.track,
          seekSeconds: currentSecondOfHour - item.startOffset,
          pushStart: item.startOffset,
          pushEnd: item.endOffset
        };
      }
    }

    // If past all tracks in hour, loop back to the last or first item seamlessly
    const item = scheduledTimeline[scheduledTimeline.length - 1];
    return { track: item.track, seekSeconds: 0 };
  }

  async function maintainTimelineSync() {
    if (!isPlaying) return;
    const current = getCurrentScheduledAudio();
    if (!current || !current.track) return;

    if (!currentTrackItem || currentTrackItem.track.fileId !== current.track.fileId) {
      currentTrackItem = current;
      await playTrackAtOffset(current.track, current.seekSeconds);
    } else {
      // Keep drifted clients tightly in sync (within 2 seconds threshold)
      const expectedTime = current.seekSeconds;
      if (Math.abs(activePlayer.currentTime - expectedTime) > 2.5) {
        activePlayer.currentTime = expectedTime;
      }
    }
  }

  async function playTrackAtOffset(track, seekSeconds) {
    const audioSrc = await resolveTrackAudio(track);
    if (!audioSrc) return;

    activePlayer.src = audioSrc;
    activePlayer.currentTime = seekSeconds || 0;
    activePlayer.play().catch(e => console.warn(e));

    updateTunerUI(track);
  }

  function setupPlayer() {
    activePlayer.addEventListener('ended', () => {
      // Audio finished naturally: jump to the next calculated push point track
      maintainTimelineSync();
    });
    activePlayer.addEventListener('loadedmetadata', () => {
      // Self-heal: if backend duration was 0, capture actual duration and report back
      if (currentTrackItem && currentTrackItem.track && !currentTrackItem.track.duration && activePlayer.duration) {
        const exactDur = Math.round(activePlayer.duration);
        currentTrackItem.track.duration = exactDur;
        fetch(BACKEND_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "updateTrackDuration", fileId: currentTrackItem.track.fileId, duration: exactDur })
        }).catch(() => {});
      }
    });
  }
  setupPlayer();

  async function fetchStationData() {
    try {
      const res = await fetch(`${BACKEND_URL}?action=getStationData`);
      const data = await res.json();
      if (data.success) {
        allTracks = data.tracks || [];
        hourlySchedules = data.hourly || {};
        sharedHourlyRandomSeq = data.hourlyRandomSequence || [];

        if (data.settings && data.settings.station_name) {
          document.getElementById('stationNameDisplay').innerText = data.settings.station_name;
        }

        scheduledTimeline = buildCurrentHourTimeline();

        document.getElementById('stationLoadingPill').style.display = 'none';
        document.getElementById('radioPowerBtn').style.display = 'block';

        const scheduled = getCurrentScheduledAudio();
        if (scheduled && scheduled.track) {
          updateTunerUI(scheduled.track);
        }
      }
    } catch(e) {
      setTimeout(fetchStationData, 4000);
    }
  }

  async function resolveTrackAudio(track) {
    if (!track) return null;
    try {
      const res = await fetch(`${BACKEND_URL}?action=streamAudio&fileId=${encodeURIComponent(track.fileId)}`);
      const data = await res.json();
      if (data.success && data.dataUri) return data.dataUri;
    } catch(err) {}
    return track.streamUrl;
  }

  function toggleRadio() {
    if (isPlaying) {
      activePlayer.pause();
      isPlaying = false;
      sendHeartbeat();
      updateTunerUI(currentTrackItem ? currentTrackItem.track : null);
    } else {
      isPlaying = true;
      sendHeartbeat();
      scheduledTimeline = buildCurrentHourTimeline();
      currentTrackItem = getCurrentScheduledAudio();
      if (currentTrackItem && currentTrackItem.track) {
        playTrackAtOffset(currentTrackItem.track, currentTrackItem.seekSeconds);
      }
    }
  }

  function updateTunerUI(track) {
    const btn = document.getElementById('radioPowerBtn');
    const vinyl = document.getElementById('vinyl');
    const title = document.getElementById('trackTitleDisplay');
    const contrib = document.getElementById('trackContributorDisplay');
    const desc = document.getElementById('trackDescDisplay');
    const slotBadge = document.getElementById('currentSlotDisplay');

    if (track) {
      title.innerText = track.title;
      contrib.innerText = "Curated by " + (track.contributor || "Synchro Voice");
      desc.innerText = track.description || "Live Synchronized Timeline";
      const nowH = new Date().getHours();
      const slot = hourlySchedules[String(nowH)];
      slotBadge.innerText = (slot && slot.name) ? `Slot: ${slot.name}` : `Hourly Push Synchronized`;
    }

    if (isPlaying) {
      btn.classList.add('playing');
      vinyl.classList.add('spinning');
    } else {
      btn.classList.remove('playing');
      vinyl.classList.remove('spinning');
    }
  }

  // File selection with automatic duration measurement
  function triggerFilePicker() { document.getElementById('audioFileInput').click(); }

  function handleFileSelected(input) {
    if (input.files && input.files.length > 0) {
      const file = input.files[0];
      selectedAudioFile = file;

      document.getElementById('fileMetaName').innerText = file.name;
      document.getElementById('fileDropZone').style.display = 'none';
      document.getElementById('selectedFileCard').style.display = 'flex';

      const tempAudio = new Audio();
      tempAudio.src = URL.createObjectURL(file);
      tempAudio.onloadedmetadata = () => {
        detectedDuration = Math.round(tempAudio.duration || 0);
      };

      const titleInput = document.getElementById('audioTitle');
      if (!titleInput.value.trim()) {
        titleInput.value = file.name.replace(/\.[^/.]+$/, "");
      }
    }
  }

  function toggleAuthMode(mode) {
    document.getElementById('loginFormBox').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('registerFormBox').style.display = mode === 'register' ? 'block' : 'none';
  }

  async function submitRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const mobile = document.getElementById('regMobile').value.trim();
    const password = document.getElementById('regPass').value.trim();
    if (!username || !mobile || !password) return showToast("Please fill all fields.");

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "register", username, mobile, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        localStorage.setItem('cr_user', JSON.stringify(currentUser));
        renderAuth();
        showToast("Account created!");
      }
    } catch(e) {
      showToast("Network error");
    }
  }

  async function submitLogin() {
    const mobile = document.getElementById('loginMobile').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    if (!mobile || !password) return showToast("Enter mobile & password");

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "login", mobile, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        localStorage.setItem('cr_user', JSON.stringify(currentUser));
        renderAuth();
        showToast("Welcome, " + currentUser.username);
      } else {
        showToast(data.message || "Login failed");
      }
    } catch(e) {
      showToast("Error connecting to backend");
    }
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('cr_user');
    renderAuth();
  }

  function renderAuth() {
    const guestBox = document.getElementById('authGuestBox');
    const memberBox = document.getElementById('authMemberBox');
    const headerLabel = document.getElementById('headerAccountLabel');

    if (!currentUser) {
      guestBox.style.display = 'block';
      memberBox.style.display = 'none';
      headerLabel.innerText = "Login";
    } else {
      guestBox.style.display = 'none';
      memberBox.style.display = 'block';
      headerLabel.innerText = currentUser.username;
      document.getElementById('profUsername').innerText = currentUser.username;
      document.getElementById('profMobile').innerText = currentUser.mobile;

      const isApproved = (currentUser.status === 'approved');
      document.getElementById('uploadAllowedSection').style.display = isApproved ? 'block' : 'none';
      document.getElementById('uploadLockedSection').style.display = isApproved ? 'none' : 'block';
    }
  }

  async function uploadAudio() {
    const title = document.getElementById('audioTitle').value.trim();
    const description = document.getElementById('audioDesc').value.trim();
    const btn = document.getElementById('uploadBtn');

    if (!title || !selectedAudioFile) return showToast("Provide a title and select a track");
    btn.disabled = true;
    btn.innerText = "Uploading to station...";

    const reader = new FileReader();
    reader.onload = async function() {
      const base64Data = reader.result.split(',')[1];
      try {
        const payload = {
          action: "uploadAudio",
          mobile: currentUser.mobile,
          username: currentUser.username,
          title,
          description,
          duration: detectedDuration || 0,
          fileName: selectedAudioFile.name,
          mimeType: selectedAudioFile.type || "audio/mpeg",
          base64File: base64Data
        };

        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          showToast("Upload Successful! Awaiting Approval.");
          document.getElementById('audioTitle').value = "";
          document.getElementById('audioDesc').value = "";
          closeAccountModal();
          fetchStationData();
        } else {
          showToast(result.message || "Upload rejected");
        }
      } catch(e) {
        showToast("Error uploading file");
      } finally {
        btn.disabled = false;
        btn.innerText = "Upload Audio Track";
      }
    };
    reader.readAsDataURL(selectedAudioFile);
  }
</script>
